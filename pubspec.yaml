name: list_smith
description: >-
  A developer-first Flutter package that wraps ListView.builder for real-world
  lists: async pagination, pull-to-refresh, and sync-or-async search.
version: 1.0.0
publish_to: none

topics:
  - listview
  - pagination
  - infinite-scroll
  - pull-to-refresh
  - search

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  infinite_scroll_pagination: ^5.1.1
  custom_refresh_indicator: ^4.0.1
  collection: ^1.19.1
  meta: ^1.17.0
  pool: ^1.5.2
  multi_value_listenable_builder_typed: ^0.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  bdd_framework: ^4.0.7
  benchmark_harness: ^2.4.0
  checks: ^0.3.1

